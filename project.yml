name: AIOStreamsTV
options:
  bundleIdPrefix: io.github.aiostreamstv
  deploymentTarget:
    # AetherEngine needs tvOS 18, which every Apple TV that runs 17 can have.
    tvOS: "18.0"
settings:
  base:
    # The next planned version: nightlies carry it; bump it after each stable release.
    MARKETING_VERSION: 0.4.0
    # CI sets the build number to the run number; this is only for local builds.
    CURRENT_PROJECT_VERSION: 1
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.56.0
targets:
  # AetherEngine in a framework of its own, so its FFmpeg is the one it calls:
  # mpv's FFmpeg is linked statically into the app, and would otherwise win.
  AIOAether:
    type: framework
    platform: tvOS
    sources:
      - path: AIOAether
    dependencies:
      - package: AetherEngine
    settings:
      base:
        PRODUCT_NAME: AIOAether
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreamstv.app.aether
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 3
        CODE_SIGN_STYLE: Automatic
  AIOStreamsTV:
    type: application
    platform: tvOS
    sources:
      - path: AIOStreamsTV
        excludes:
          - Info.plist
          - bridge.js
          - Fonts
      - path: AIOStreamsTV/bridge.js
        buildPhase: resources
      # A folder in the app, for libass to read the subtitle font from.
      - path: AIOStreamsTV/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: AIOAether
        embed: true
    settings:
      base:
        PRODUCT_NAME: AIOStreamsTV
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreamstv.app
        INFOPLIST_FILE: AIOStreamsTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        TARGETED_DEVICE_FAMILY: 3
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
        # WebKit is loaded at runtime; nothing links against it.
        GCC_WARN_UNDECLARED_SELECTOR: NO
    scheme: {}
