name: AIOStreamsTV
options:
  bundleIdPrefix: io.github.aiostreamstv
  deploymentTarget:
    tvOS: "17.5"
settings:
  base:
    # The next planned version: nightlies carry it; bump it after each stable release.
    MARKETING_VERSION: 0.2.0
    # CI sets the build number to the run number; this is only for local builds.
    CURRENT_PROJECT_VERSION: 1
targets:
  AIOStreamsTV:
    type: application
    platform: tvOS
    sources:
      - path: AIOStreamsTV
        excludes:
          - Info.plist
          - bridge.js
          - Fonts
          - "*.entitlements"
      - path: Shared
      - path: AIOStreamsTV/bridge.js
        buildPhase: resources
      # A folder in the app, for libass to read the subtitle font from.
      - path: AIOStreamsTV/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AIOStreamsTV
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreamstv.app
        INFOPLIST_FILE: AIOStreamsTV/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIOStreamsTV/AIOStreamsTV.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        TARGETED_DEVICE_FAMILY: 3
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
        # WebKit is loaded at runtime; nothing links against it.
        GCC_WARN_UNDECLARED_SELECTOR: NO
    dependencies:
      - target: TopShelf
      - sdk: TVServices.framework
    scheme: {}

  # Continue Watching on the Home Screen's Top Shelf, from what the app saves
  # in the App Group they share.
  TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    dependencies:
      - sdk: TVServices.framework
    settings:
      base:
        PRODUCT_NAME: TopShelf
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreamstv.app.TopShelf
        INFOPLIST_FILE: TopShelf/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TopShelf/TopShelf.entitlements
        CLANG_ENABLE_OBJC_ARC: YES
        TARGETED_DEVICE_FAMILY: 3
        CODE_SIGN_STYLE: Automatic
