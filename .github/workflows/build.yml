name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen xcbeautify
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Project
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace AIOStreamsTV.xcworkspace \
            -scheme AIOStreamsTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | xcbeautify || (tail -200 build.log; exit 1)

      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/AIOStreamsTV.app Payload/
          zip -qry AIOStreamsTV.ipa Payload
          ls -lh AIOStreamsTV.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIOStreamsTV-ipa
          path: AIOStreamsTV.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AIOStreamsTV.ipa
